<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF6B6B">
<title>English Flashcards 4 Kids v4.5.1</title>
<meta name="version" content="4.5.1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<script src="vosk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:#FFF9F0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
/* SPLASH */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#FF6B6B,#FF8E53);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;cursor:pointer;user-select:none;}
.sp-emoji{font-size:100px;animation:bob 1.1s ease-in-out infinite alternate;}
.sp-title{font-family:'Fredoka One',cursive;font-size:36px;color:#fff;text-align:center;line-height:1.2;}
.sp-title span{font-size:48px;display:block;}
.sp-sub{font-family:'Fredoka One',cursive;font-size:22px;color:rgba(255,255,255,.85);text-align:center;padding:0 24px;animation:blink 1.4s ease-in-out infinite;}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
/* LOADING VOSK */
#vosk-loading{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:998;}
#vosk-loading.show{display:flex;}
.vl-text{font-family:'Fredoka One',cursive;font-size:22px;color:#fff;text-align:center;padding:0 24px;}
.vl-bar{width:260px;height:12px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden;}
.vl-fill{height:100%;background:#51CF66;border-radius:8px;animation:pulse-bar 1.2s ease-in-out infinite;}
@keyframes pulse-bar{0%,100%{width:20%}50%{width:80%}}
/* TOPBAR */
#topbar{width:100%;max-width:600px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px 4px;}
#logo{font-family:'Fredoka One',cursive;font-size:17px;color:#FF6B6B;line-height:1.2;}
#logo span{font-size:21px;display:block;}
#stars-box{display:flex;align-items:center;gap:6px;background:#fff;border-radius:50px;padding:6px 14px;font-weight:900;font-size:19px;box-shadow:0 2px 10px rgba(0,0,0,.1);}
/* CATEGORY MENU */
#cat-screen{width:100%;max-width:600px;display:flex;flex-direction:column;padding:6px 14px 14px;gap:10px;}
#cat-title{font-family:'Fredoka One',cursive;font-size:26px;text-align:center;color:#aaa;padding:4px 0;}
#cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cat-card{border:none;border-radius:22px;padding:14px 12px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.15);transition:transform .15s;color:#fff;font-family:'Fredoka One',cursive;}
.cat-card:active{transform:scale(.94);}
.cc-icon{font-size:38px;line-height:1;}
.cc-title{font-size:20px;}
/* SUBCATEGORY MENU */
#sub-screen{width:100%;max-width:600px;display:none;flex-direction:column;padding:6px 14px 14px;gap:10px;}
#sub-back{background:none;border:none;font-size:28px;cursor:pointer;align-self:flex-start;padding:2px 4px;}
#sub-title{font-family:'Fredoka One',cursive;font-size:22px;text-align:center;color:#aaa;padding:4px 0;}
#sub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.sub-card{border:none;border-radius:20px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .15s;color:#fff;font-family:'Fredoka One',cursive;}
.sub-card:active{transform:scale(.94);}
.sc-icon{font-size:34px;line-height:1;}
.sc-title{font-size:17px;text-align:center;}
.sc-count{font-size:13px;opacity:.8;}
/* GAME */
#game-screen{width:100%;max-width:100%;display:none;flex-direction:column;align-items:center;padding:4px 100px 12px;gap:8px;min-height:100dvh;}
#top-row{width:100%;display:flex;align-items:center;gap:10px;}
#btn-back-game{background:none;border:none;font-size:28px;cursor:pointer;padding:2px 4px;border-radius:10px;flex-shrink:0;}
#prog-wrap{flex:1;height:12px;background:#e8e8e8;border-radius:8px;overflow:hidden;}
#prog-bar{height:100%;border-radius:8px;transition:width .5s ease;width:0%;}
#stars-box-game{display:flex;align-items:center;gap:5px;background:#fff;border-radius:50px;padding:5px 12px;font-weight:900;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0;}
#main-card{width:100%;max-width:500px;min-height:460px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 60px;box-shadow:0 8px 32px rgba(0,0,0,.12);background:#fff;position:relative;overflow:hidden;border-top:8px solid #FF6B6B;transition:border-top-color .3s;}
.btn-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;font-size:20px;cursor:pointer;background:rgba(0,0,0,.07);color:#888;transition:background .15s,transform .15s;display:flex;align-items:center;justify-content:center;}
.btn-arrow:active{background:rgba(0,0,0,.18);transform:translateY(-50%) scale(.88);}
#btn-prev{left:8px;}#btn-next{right:8px;}
#main-emoji{font-size:220px;line-height:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
#main-word{font-family:'Fredoka One',cursive;font-size:44px;text-transform:uppercase;text-align:center;transition:color .3s;}
#syl-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:36px;align-items:center;}
.syl{font-family:'Fredoka One',cursive;font-size:23px;padding:3px 9px;border-radius:10px;background:#f1f3f5;color:#bbb;transition:background .15s,transform .2s;}
.syl.lit{background:#FFA94D;color:#fff;transform:scale(1.18);}
#wave{display:flex;align-items:flex-end;gap:4px;height:22px;opacity:0;transition:opacity .25s;}
#wave.on{opacity:1;}
.wb{width:5px;border-radius:3px;animation:wv .75s ease-in-out infinite;}
.wb:nth-child(1){height:8px;animation-delay:0s}.wb:nth-child(2){height:16px;animation-delay:.12s}.wb:nth-child(3){height:22px;animation-delay:.24s}.wb:nth-child(4){height:14px;animation-delay:.36s}.wb:nth-child(5){height:8px;animation-delay:.48s}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
#partial-text{font-size:14px;color:#aaa;font-style:italic;height:20px;overflow:hidden;}
#feedback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:28px;pointer-events:none;opacity:0;transition:opacity .25s;}
#feedback.show{opacity:1;}
#fb-emoji{font-size:70px;}
#fb-text{font-family:'Fredoka One',cursive;font-size:28px;color:#fff;text-align:center;padding:0 12px;}
#status-text{font-family:'Fredoka One',cursive;font-size:17px;color:#aaa;text-align:center;text-transform:uppercase;min-height:24px;width:100%;max-width:500px;}
/* FIXED BUTTONS */
#btn-listen{position:fixed;left:0;top:50%;transform:translateY(-50%);width:86px;height:86px;border-radius:0 50px 50px 0;border:none;font-size:38px;cursor:pointer;background:#FFA94D;color:#fff;box-shadow:4px 0 20px rgba(255,169,77,.5);transition:background .2s,transform .15s;z-index:100;display:flex;align-items:center;justify-content:center;}
#btn-listen:active{transform:translateY(-50%) scale(.9);}
#btn-listen.speaking{background:#339AF0;}
#btn-mic{position:fixed;right:0;top:50%;transform:translateY(-50%);width:92px;height:92px;border-radius:50px 0 0 50px;border:none;font-size:44px;cursor:pointer;background:#FF6B6B;color:#fff;box-shadow:-4px 0 20px rgba(255,107,107,.5);transition:background .2s,transform .15s,opacity .2s;z-index:100;display:flex;align-items:center;justify-content:center;}
#btn-mic:active:not(:disabled){transform:translateY(-50%) scale(.9);}
#btn-mic.listening{background:#339AF0;animation:pulse .9s ease-out infinite;}
#btn-mic.success{background:#51CF66;}
#btn-mic:disabled{opacity:.28;cursor:not-allowed;animation:none !important;}
@keyframes pulse{0%{box-shadow:-4px 0 20px rgba(51,154,240,.8),0 0 0 0 rgba(51,154,240,.6)}70%{box-shadow:-4px 0 20px rgba(51,154,240,.4),0 0 0 22px rgba(51,154,240,0)}100%{box-shadow:-4px 0 20px rgba(51,154,240,.8),0 0 0 0 rgba(51,154,240,0)}}
/* CONFETTI */
.cf{position:fixed;width:12px;height:12px;pointer-events:none;z-index:200;animation:cff 1.5s ease-in forwards;}
@keyframes cff{from{transform:translateY(-40px) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(760deg);opacity:0}}
/* STREAK */
#streak{position:fixed;top:56px;right:100px;background:#FFA94D;color:#fff;font-family:'Fredoka One',cursive;font-size:18px;border-radius:50px;padding:6px 14px;box-shadow:0 4px 16px rgba(255,169,77,.5);transform:scale(0);transition:transform .4s cubic-bezier(.4,0,.2,1);z-index:50;}
#streak.on{transform:scale(1);}
/* VOSK STATUS */
#vosk-status{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-family:'Fredoka One',cursive;font-size:13px;border-radius:20px;padding:4px 14px;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s;}
#vosk-status.show{opacity:1;}

/* SOLAR SYSTEM MODE */
#solar-screen{width:100%;max-width:100%;display:none;flex-direction:column;align-items:center;min-height:100dvh;background:#1a1a2e;position:relative;}
#solar-top-row{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;position:relative;z-index:10;}
#solar-map-wrap{position:relative;width:100%;max-width:900px;margin:0 auto;touch-action:none;overflow:hidden;border-radius:12px;}
#solar-map-img{width:100%;height:auto;display:block;border-radius:12px;transform-origin:0 0;will-change:transform;}
#solar-svg{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;}
.solar-hotspot{position:absolute;border-radius:50%;cursor:pointer;background:rgba(255,255,255,0);border:3px solid transparent;transition:border-color .2s, background .2s;transform:translate(-50%,-50%);}
.solar-hotspot:active, .solar-hotspot.active{background:rgba(255,255,255,0.25);border-color:rgba(255,255,255,0.8);}
#solar-feedback{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:50;}
#solar-feedback.show{opacity:1;}
#solar-fb-bubble{background:rgba(0,0,0,0.75);border-radius:28px;padding:16px 32px;display:flex;flex-direction:column;align-items:center;gap:8px;}
#solar-fb-emoji{font-size:60px;}
#solar-fb-word{font-family:'Fredoka One',cursive;font-size:36px;color:#fff;text-transform:uppercase;}
#solar-fb-text{font-family:'Fredoka One',cursive;font-size:22px;color:#fff;}
#solar-status{font-family:'Fredoka One',cursive;font-size:16px;color:rgba(255,255,255,0.7);text-align:center;padding:6px 0;text-transform:uppercase;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-emoji">🌍</div>
  <div class="sp-title"><span>ENGLISH v4.5.1</span>FLASHCARDS 4 KIDS</div>
  <div class="sp-sub">👆 TAP TO START!</div>
</div>

<!-- VOSK LOADING -->
<div id="vosk-loading">
  <div class="sp-emoji" style="font-size:60px;">🎤</div>
  <div class="vl-text">Loading voice recognition...<br><span style="font-size:16px;opacity:.7">First time only — ~40MB</span></div>
  <div class="vl-bar"><div class="vl-fill"></div></div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div id="logo"><span>ENGLISH v4.5.1</span>FLASHCARDS 4 KIDS</div>
  <div id="stars-box">⭐ <span id="stars">0</span></div>
</div>

<!-- CATEGORY MENU -->
<div id="cat-screen">
  <div id="cat-title">PICK A CATEGORY!</div>
  <div id="cat-grid"></div>
</div>

<!-- SUBCATEGORY MENU -->
<div id="sub-screen">
  <button id="sub-back">⬅️</button>
  <div id="sub-title">PICK A TOPIC!</div>
  <div id="sub-grid"></div>
</div>

<!-- GAME -->
<div id="game-screen">
  <div id="top-row">
    <button id="btn-back-game">⬅️</button>
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <div id="stars-box-game">⭐ <span id="stars-game">0</span></div>
  </div>
  <div id="main-card">
    <button class="btn-arrow" id="btn-prev">◀</button>
    <button class="btn-arrow" id="btn-next">▶</button>
    <div id="main-emoji"></div>
    <div id="main-word">DOG</div>
    <div id="syl-row"></div>
    <div id="wave"><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div></div>
    <div id="partial-text"></div>
    <div id="feedback"><div id="fb-emoji"></div><div id="fb-text"></div></div>
  </div>
  <div id="status-text">LISTEN FIRST! 🔊</div>
</div>

<!-- SOLAR SYSTEM SCREEN -->
<div id="solar-screen">
  <div id="solar-top-row">
    <button id="btn-back-solar" style="background:none;border:none;font-size:28px;cursor:pointer;padding:2px 4px;color:#fff;">⬅️</button>
    <div style="flex:1;font-family:'Fredoka One',cursive;font-size:18px;color:#fff;text-align:center;">SOLAR SYSTEM 🪐</div>
    <div style="display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);border-radius:50px;padding:5px 12px;font-weight:900;font-size:17px;color:#fff;">⭐ <span id="stars-solar">0</span></div>
  </div>
  <div id="solar-status">TAP A PLANET!</div>
  <div id="solar-map-wrap">
    <img id="solar-map-img" src="img/solar_system.png" alt="Solar System">
    <svg id="solar-svg" viewBox="0 0 1920 1209" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;"></svg>
  </div>
  <div id="solar-feedback">
    <div id="solar-fb-bubble">
      <div id="solar-fb-emoji"></div>
      <div id="solar-fb-word"></div>
      <div id="solar-fb-text"></div>
    </div>
  </div>
</div>

<button id="btn-listen" style="display:none">🔊</button>
<button id="btn-mic" style="display:none" disabled>🎤</button>
<div id="streak">🔥 <span id="streak-n">3</span> IN A ROW!</div>
<div id="vosk-status"></div>

<script>
// ── STATE ──
let stars=0, streak=0, streakTimer=null;
let deck=[], idx=0, attempts=0, busy=false, listening=false;
let currentCat=null, currentSub=null;
let voskModel=null, voskReady=false;

// ── TTS ──
const synth=window.speechSynthesis||null;
let voices=[];
if(synth){synth.onvoiceschanged=()=>{voices=synth.getVoices();};}
function pickVoice(){return voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>v.lang.startsWith('en')&&v.localService)||voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;}

function speak(text,rate,pitch,onDone){
  const wave=document.getElementById('wave');
  const bl=document.getElementById('btn-listen');
  const cleanup=()=>{wave.classList.remove('on');bl.classList.remove('speaking');};
  if(window._TTS){
    wave.classList.add('on');bl.classList.add('speaking');
    const estMs=Math.max(1200,text.length*120);
    window._TTS.stop().catch(()=>{});
    setTimeout(()=>{
      window._TTS.speak({text,lang:'en-US',rate:rate||0.88,pitch:pitch||1.1,volume:1.0}).catch(()=>{});
      setTimeout(()=>{cleanup();if(onDone)onDone();},estMs);
    },100);
    return;
  }
  if(!synth){if(onDone)setTimeout(onDone,300);return;}
  synth.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate||0.88;u.pitch=pitch||1.1;u.volume=1.0;
    const v=pickVoice();if(v)u.voice=v;
    wave.classList.add('on');bl.classList.add('speaking');
    u.onend=()=>{cleanup();if(onDone)onDone();};
    u.onerror=()=>{cleanup();if(onDone)onDone();};
    setTimeout(cleanup,6000);
    synth.speak(u);
  },55);
}

function speakSyllables(syls,done){
  if(synth)synth.cancel();
  let i=0;
  const wave=document.getElementById('wave');
  function next(){
    if(i>=syls.length){renderSyls(syls,-1);setTimeout(done,380);return;}
    renderSyls(syls,i);
    setTimeout(()=>{
      if(window._TTS){
        wave.classList.add('on');
        window._TTS.speak({text:syls[i].toLowerCase(),lang:'en-US',rate:0.52,pitch:1.2,volume:1.0})
          .then(()=>{wave.classList.remove('on');i++;setTimeout(next,400);})
          .catch(()=>{wave.classList.remove('on');i++;setTimeout(next,400);});
        return;
      }
      if(!synth){i++;setTimeout(next,200);return;}
      const u=new SpeechSynthesisUtterance(syls[i].toLowerCase());
      u.lang='en-US';u.rate=0.52;u.pitch=1.2;u.volume=1.0;
      const v=pickVoice();if(v)u.voice=v;
      u.onstart=()=>wave.classList.add('on');
      u.onend=()=>{wave.classList.remove('on');i++;setTimeout(next,400);};
      u.onerror=()=>{wave.classList.remove('on');i++;setTimeout(next,400);};
      synth.speak(u);
    },55);
  }
  next();
}

// ── VOSK ──
async function initVosk(){
  showVoskLoading(true);
  try{
    voskModel=await Vosk.createModel('vosk-model-small-en-us-0.15.tar');
    voskReady=true;
    console.log('Vosk ready');
    showVoskStatus('🎤 Voice ready!',2000);

  }catch(e){
    console.warn('Vosk failed, will retry on demand:',e.message);
    // Try CDN fallback
    try{
      voskModel=await Vosk.createModel('https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz');
      voskReady=true;
      console.log('Vosk ready (CDN)');
      showVoskStatus('🎤 Voice ready!',2000);
    }catch(e2){
      console.warn('Vosk CDN also failed:',e2.message);
      showVoskStatus('⚠️ Voice offline mode',3000);
    }
  }
  showVoskLoading(false);
}

function showVoskLoading(show){
  document.getElementById('vosk-loading').classList.toggle('show',show);
}
function showVoskStatus(msg,ms){
  const el=document.getElementById('vosk-status');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),ms||2000);
}

// Vosk SR state
let voskRecognizer=null, voskAudioCtx=null, voskNode=null, voskStream=null;

async function startListening(){
  if(listening||busy)return;
  if(!voskReady){setStatus('VOICE NOT READY YET...');return;}

  listening=true;setMicState('listening');setStatus('LISTENING...');
  document.getElementById('partial-text').textContent='';

  const wordList=[...new Set(deck.map(w=>w.w))].concat(['[unk]']);
  const vocab=JSON.stringify(wordList);

  try{
    voskRecognizer=new voskModel.KaldiRecognizer(16000,vocab);
    voskRecognizer.on('result',msg=>{
      const text=(msg.result.text||'').trim();
      console.log('VOSK RESULT:',text,'| target:',deck[idx].w);
      if(text&&text!=='[unk]'&&text!==''){
        document.getElementById('partial-text').textContent='';
        stopListening();
        evaluate([text]);
      }
    });
    voskRecognizer.on('partialresult',msg=>{
      const p=(msg.result.partial||'').trim();
      if(p&&p!=='[unk]')document.getElementById('partial-text').textContent='"'+p+'"';
    });

    voskStream=await navigator.mediaDevices.getUserMedia({video:false,audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});
    voskAudioCtx=new AudioContext();
    const source=voskAudioCtx.createMediaStreamSource(voskStream);
    voskNode=voskAudioCtx.createScriptProcessor(4096,1,1);
    voskNode.onaudioprocess=e=>{try{voskRecognizer.acceptWaveform(e.inputBuffer);}catch(err){}};
    source.connect(voskNode);
    voskNode.connect(voskAudioCtx.destination);

    // 5s timeout
    const _voskTimeoutMs=deck[idx].w.length>6?7000:5000;
    window._voskTimer=setTimeout(()=>{
      if(listening){
        const p=document.getElementById('partial-text').textContent;
        console.log('Vosk timeout, partial:',p);
        stopListening();
        if(p&&p!==''){
          const word=p.replace(/"/g,'').trim();
          evaluate([word]);
        } else {
          attempts++;onWrong(attempts);
        }
      }
    },_voskTimeoutMs);

  }catch(e){
    console.warn('Vosk listen error:',e.message);
    listening=false;setMicState('idle');
    setStatus('MIC ERROR — TRY AGAIN');
    enableMic(true);
  }
}

function stopListening(){
  clearTimeout(window._voskTimer);
  listening=false;
  if(voskNode){voskNode.disconnect();voskNode=null;}
  if(voskAudioCtx){const _ctx=voskAudioCtx;voskAudioCtx=null;_ctx.close().catch(()=>{});}
  if(voskStream){voskStream.getTracks().forEach(t=>t.stop());voskStream=null;}
  if(voskRecognizer){try{voskRecognizer.remove();}catch(e){}voskRecognizer=null;}
  setMicState('idle');
  document.getElementById('wave').classList.remove('on');
  document.getElementById('btn-listen').classList.remove('speaking');
}

// ── FUZZY MATCH ──
function lev(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?j?0:i:j));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
function sim(a,b){a=a.toLowerCase().trim();b=b.toLowerCase().trim();if(a===b)return 1;const L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1;}

function evaluate(alts){
  if(busy)return;
  const target=deck[idx].w.toLowerCase();
  let best=0;
  alts.forEach(h=>{
    best=Math.max(best,sim(target,h));
    h.split(/\s+/).forEach(t=>{best=Math.max(best,sim(target,t));});
    best=Math.max(best,sim(target,h.replace(/^(a |an |the )/i,'').trim()));
  });
  // Special case: pink is often misheard as gray by Vosk
  if(target==='pink'){
    const heard=alts.join(' ').toLowerCase();
    if(/ink|think|ping|pink/.test(heard))best=1.0;
  }
  const charLen=target.replace(/\s/g,'').length;
  const threshold=charLen<=3?0.6:charLen<=5?0.68:0.75;
  console.log('heard:',alts,'| target:',target,'| score:',best.toFixed(2),'| need:',threshold);
  best>=threshold?onCorrect():(attempts++,onWrong(attempts));
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}

function startGame(catKey,subKey){
  currentCat=catKey;currentSub=subKey;
  if(subKey==='solar'){startSolarGame();return;}
  const cat=WORDS_DATA[catKey];
  const sub=cat.subcategories[subKey];
  deck=shuffle(sub.words);idx=0;attempts=0;busy=false;
  // Keep opposite pairs consecutive
  const PAIRS=[
    ['big','small',null,null],
    ['long','short',null,'img/short_long.jpg'],
    ['tall','short',null,'img/short.jpg'],
    ['fat','thin',null,null],
    ['heavy','light',null,null],
    ['old','young',null,null]
  ];
  PAIRS.forEach(([a,b,aImg,bImg])=>{
    const ai=deck.findIndex(w=>w.w===a&&(!aImg||w.img===aImg));
    const bi=deck.findIndex(w=>w.w===b&&(!bImg||w.img===bImg));
    if(ai<0||bi<0)return;
    const first=Math.min(ai,bi),second=Math.max(ai,bi);
    const pairWords=[deck[ai],deck[bi]];
    deck.splice(second,1);deck.splice(first,1);
    deck.splice(first,0,...pairWords);
  });

  document.getElementById('topbar').style.display='none';
  document.getElementById('cat-screen').style.display='none';
  document.getElementById('sub-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  document.getElementById('btn-listen').style.display='flex';
  document.getElementById('btn-mic').style.display='flex';

  const color=cat.color||'#888';
  document.getElementById('main-card').style.borderTopColor=color;
  document.getElementById('prog-bar').style.background=color;
  document.getElementById('main-word').style.color=color;
  document.querySelectorAll('.wb').forEach(b=>b.style.background=color);

  // Warm up TTS then show first card after a short delay
  // Clear stale content immediately before delay
  const _me=document.getElementById('main-emoji');
  _me.innerHTML='';_me.textContent='';_me.style.opacity='0';
  document.getElementById('main-word').textContent='';
  document.getElementById('syl-row').innerHTML='';
  document.getElementById('main-card').style.visibility='hidden';
  setStatus('GET READY... 🎯');
  speak(sub.label, 1.0, 1.1, ()=>{ setTimeout(showCard, 600); });
}

function showCard(){
  stopListening();if(synth)synth.cancel();hideFeedback();attempts=0;busy=false;
  document.getElementById('main-card').style.visibility='visible';
  const item=deck[idx];
  // Clear media immediately to avoid stale image flash
  const mediaEl=document.getElementById('main-emoji');
  mediaEl.innerHTML='';mediaEl.textContent='';mediaEl.style.opacity='0';
  if(item.img){
    const imgSize='360px';
    const _img=new Image();
    _img.style.cssText=`width:${imgSize};height:${imgSize};object-fit:contain;border-radius:12px;`;
    _img.alt=item.w;
    _img.onload=()=>{mediaEl.innerHTML='';mediaEl.appendChild(_img);mediaEl.style.opacity='1';};
    _img.onerror=()=>{mediaEl.innerHTML='';mediaEl.textContent=item.e;mediaEl.style.opacity='1';};
    _img.src=item.img;
  } else {
    mediaEl.textContent=item.e;
    mediaEl.style.opacity='1';
  }
  mediaEl.style.transform='scale(1)';
  document.getElementById('main-word').textContent=item.w.toUpperCase();
  document.getElementById('partial-text').textContent='';
  renderSyls(item.s,-1);updateProg();
  setMicState('idle');enableMic(false);
  if(!voskReady){
    setStatus('🎤 LOADING VOICE...');
    const waitVosk=setInterval(()=>{
      if(voskReady){clearInterval(waitVosk);_playCard(item);}
    },200);
  } else {
    _playCard(item);
  }
}
function _playCard(item){
  setStatus('LISTEN FIRST! 🔊');
  setTimeout(()=>speak(item.w,0.88,1.1,()=>{
    enableMic(true);
    setMicState('listening');
    setStatus('NOW SAY THE WORD! 🎤');
    startListening();
  }),600);
}

function navPrev(){if(busy)return;if(synth)synth.cancel();stopListening();idx=(idx-1+deck.length)%deck.length;setTimeout(showCard,200);}
function navNext(){if(busy)return;if(synth)synth.cancel();stopListening();idx=(idx+1)%deck.length;setTimeout(showCard,200);}

function renderSyls(syls,lit){
  const row=document.getElementById('syl-row');
  if(!syls||syls.length<=1){row.innerHTML='';return;}
  row.innerHTML=syls.map((s,i)=>`<span class="syl${i===lit?' lit':''}">${s}</span>`).join('');
}
function updateProg(){document.getElementById('prog-bar').style.width=(deck.length?(idx+1)/deck.length*100:0)+'%';}
function enableMic(on){document.getElementById('btn-mic').disabled=!on;}

function onCorrect(){
  if(busy)return;busy=true;
  if(document.getElementById('solar-screen').style.display==='flex'){
    streak++;stars+=10;
    document.getElementById('stars').textContent=stars;
    document.getElementById('stars-solar').textContent=stars;
    setMicState('success');
    showSolarFeedback('✅',solarItem?solarItem.w.toUpperCase():'','AMAZING! +10 ⭐','#51CF66');
    confetti();showStreak();
    solarBusy=false;solarItem=null;attempts=0;busy=false;
    enableMic(false);
    document.querySelectorAll('#solar-svg circle').forEach(c=>{c.setAttribute('fill','rgba(255,255,255,0)');c.setAttribute('stroke','rgba(255,255,255,0)');});
    setTimeout(()=>{ setSolarStatus('TAP A PLANET! 🪐'); },1800);
    return;
  }
  streak++;stars+=10;
  document.getElementById('stars').textContent=stars;
  document.getElementById('stars-game').textContent=stars;
  setMicState('success');setStatus('GREAT JOB! 🎉');
  showFeedback('✅','AMAZING!','#51CF66');
  confetti();showStreak();
  const em=document.getElementById('main-emoji');
  em.style.transform='scale(1.4)';
  setTimeout(()=>em.style.transform='scale(1)',350);
  setTimeout(()=>{hideFeedback();idx++;if(idx>=deck.length)finishGame();else showCard();},1900);
}

function onWrong(n){
  streak=0;document.getElementById('streak').classList.remove('on');
  busy=false;
  const isSolar=document.getElementById('solar-screen').style.display==='flex';
  const item=isSolar?solarItem:deck[idx];
  if(isSolar){ solarAttempts=n; }
  enableMic(false);
  console.log('onWrong attempt:',n,'word:',item.w);
  if(n===1){
    setStatus('LISTEN CAREFULLY!');
    showFeedback('👂','LISTEN AGAIN!','#FFA94D');
    setTimeout(()=>{hideFeedback();speak(item.w,0.6,1.1,()=>{enableMic(true);setStatus('TRY AGAIN! 🎤');});},700);
  } else if(n===2){
    setStatus('LISTEN TO EACH PART!');
    showFeedback('🔤','SAY EACH PART!','#CC5DE8');
    setTimeout(()=>{hideFeedback();speakSyllables(item.s,()=>{speak(item.w,0.65,1.1,()=>{enableMic(true);setStatus('TRY AGAIN! 🎤');});});},700);
  } else {
    deck.push(item);
    showFeedback('⏭️','GOOD TRY! NEXT ONE!','#888');
    setTimeout(()=>{hideFeedback();busy=false;idx++;if(idx>=deck.length)finishGame();else showCard();},1800);
  }
}

function finishGame(){
  showFeedback('🏆','YOU DID IT! 🎉','#FFA94D');
  confetti();confetti();
  setTimeout(()=>{hideFeedback();goMenu();},3000);
}

function goMenu(){
  stopListening();if(synth)synth.cancel();busy=false;hideFeedback();
  document.getElementById('game-screen').style.display='none';
  document.getElementById('btn-listen').style.display='none';
  document.getElementById('btn-mic').style.display='none';
  document.getElementById('topbar').style.display='flex';

  if(currentCat&&currentSub){
    const cat=WORDS_DATA[currentCat];
    const subKeys=Object.keys(cat.subcategories);
    if(subKeys.length===1){
      buildCatMenu();
    } else {
      showSubMenu(currentCat);
    }
  } else {
    buildCatMenu();
  }
}

function startSolarGame(){
  stopListening();if(synth)synth.cancel();

    SOLAR_HOTSPOTS.forEach(planet=>{

      const cy=planet.cy/100*1209;
      const r=planet.r/100*1920;
      const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');

function initSolarZoom(){
  const wrap=document.getElementById('solar-map-wrap');
  const img=document.getElementById('solar-map-img');
  const layer=document.getElementById('solar-svg');
  let scale=1, lastScale=1, originX=0, originY=0, lastX=0, lastY=0;
  let startDist=0, startScale=1;

  function applyTransform(){
    const t=`translate(${originX}px,${originY}px) scale(${scale})`;
    img.style.transform=t;
    layer.style.transform=t;
  }

  wrap.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      e.preventDefault();
      startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      startScale=scale;
    }
  },{passive:false});

  wrap.addEventListener('touchmove', e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      scale=Math.min(4, Math.max(1, startScale*(dist/startDist)));
      // Zoom toward center of pinch
      const cx=((e.touches[0].clientX+e.touches[1].clientX)/2)-wrap.getBoundingClientRect().left;
      const cy=((e.touches[0].clientY+e.touches[1].clientY)/2)-wrap.getBoundingClientRect().top;
      originX=cx-(cx-originX)*(scale/lastScale);
      originY=cy-(cy-originY)*(scale/lastScale);
      lastScale=scale;
      // Clamp pan
      const maxX=wrap.offsetWidth*(scale-1);
      const maxY=wrap.offsetHeight*(scale-1);
      originX=Math.min(0,Math.max(-maxX,originX));
      originY=Math.min(0,Math.max(-maxY,originY));
      applyTransform();
    }
  },{passive:false});

  // Double-tap to reset zoom
  let lastTap=0;
  wrap.addEventListener('touchend', e=>{
    if(e.touches.length===0&&e.changedTouches.length===1){
      const now=Date.now();
      if(now-lastTap<300){scale=1;originX=0;originY=0;lastScale=1;applyTransform();}
      lastTap=now;
    }
  });
}

function solarTap(planet){
  if(solarBusy)return;
  if(solarItem&&solarItem.w===planet.w&&solarAttempts>0)return; // already active, ignore re-tap
  stopListening();if(synth)synth.cancel();
  solarItem=planet;solarAttempts=0;solarBusy=false;
  // Highlight tapped hotspot
  document.querySelectorAll('#solar-svg circle').forEach(c=>{c.setAttribute('fill','rgba(255,255,255,0)');c.setAttribute('stroke','rgba(255,255,255,0)');});
  const activeCircle=document.querySelector(`#solar-svg circle[data-word="${planet.w}"]`);
  if(activeCircle){activeCircle.setAttribute('fill','rgba(255,255,255,0.2)');activeCircle.setAttribute('stroke','rgba(255,255,255,0.9)');}
  // Build single-word deck for evaluate/onWrong to work
  deck=[{w:planet.w,e:planet.e,s:planet.s}];idx=0;attempts=0;busy=false;
  setSolarStatus('LISTEN FIRST! 🔊');
  speak(planet.w, 0.88, 1.1, ()=>{
    setSolarStatus('NOW SAY IT! 🎤');
    enableMic(true);
    setTimeout(startListening, 800);
  });
}

function setSolarStatus(t){
  const el=document.getElementById('solar-status');
  if(el)el.textContent=t;
}

function showSolarFeedback(emoji,word,text,color){
  document.getElementById('solar-fb-emoji').textContent=emoji;
  document.getElementById('solar-fb-word').textContent=word;
  document.getElementById('solar-fb-text').textContent=text;
  const fb=document.getElementById('solar-feedback');
  document.getElementById('solar-fb-bubble').style.borderLeft=`6px solid ${color}`;
  fb.classList.add('show');
  setTimeout(()=>fb.classList.remove('show'),1600);
}

function hideSolarFeedback(){
  document.getElementById('solar-feedback').classList.remove('show');
}

function goMenuFromSolar(){
  stopListening();if(synth)synth.cancel();
  solarBusy=false;solarItem=null;
  document.getElementById('solar-screen').style.display='none';
  document.getElementById('btn-listen').style.display='none';
  document.getElementById('btn-mic').style.display='none';
  document.getElementById('topbar').style.display='flex';
  showSubMenu(currentCat);
}

document.getElementById('btn-back-solar').addEventListener('click', goMenuFromSolar);

// ── EVENTS ──
let _micLastTap=0;
document.getElementById('btn-listen').addEventListener('click',()=>{
  if(!deck.length)return;enableMic(false);
  speak(deck[idx].w,0.88,1.1,()=>{enableMic(true);setStatus('NOW SAY THE WORD! 🎤');});
});
document.getElementById('btn-mic').addEventListener('click',()=>{
  const now=Date.now();if(now-_micLastTap<800)return;_micLastTap=now;
  if(listening){stopListening();return;}
  startListening();
});
document.getElementById('btn-back-game').addEventListener('click',()=>{if(synth)synth.cancel();goMenu();});
document.getElementById('btn-prev').addEventListener('click',navPrev);
document.getElementById('btn-next').addEventListener('click',navNext);
document.addEventListener('keydown',e=>{
  if(document.getElementById('game-screen').style.display==='none')return;
  if(e.key===' '){e.preventDefault();listening?stopListening():startListening();}
  if(e.key==='ArrowRight')navNext();if(e.key==='ArrowLeft')navPrev();
  if(e.key==='r'||e.key==='R'){enableMic(false);speak(deck[idx].w,0.88,1.1,()=>enableMic(true));}
});

// ── INIT ──
loadWords();
</script>
</body>
</html>
