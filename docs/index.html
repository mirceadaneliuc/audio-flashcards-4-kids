<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="English vocabulary flashcards for kids — audio, voice recognition, syllable breakdown">
<meta name="theme-color" content="#FF6B6B">
<title>English Flashcards 4 Kids v1.5.0</title>
<meta name="version" content="1.5.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:#FFF9F0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#FF6B6B,#FF8E53);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;cursor:pointer;user-select:none;}
.sp-emoji{font-size:100px;animation:bob 1.1s ease-in-out infinite alternate;}
.sp-title{font-family:'Fredoka One',cursive;font-size:36px;color:#fff;text-align:center;line-height:1.2;}
.sp-title span{font-size:48px;display:block;}
.sp-sub{font-family:'Fredoka One',cursive;font-size:22px;color:rgba(255,255,255,.85);text-align:center;padding:0 24px;animation:blink 1.4s ease-in-out infinite;}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

/* ── TOP BAR ── */
#topbar{width:100%;max-width:600px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px 4px;}
#logo{font-family:'Fredoka One',cursive;font-size:17px;color:#FF6B6B;line-height:1.2;}
#logo span{font-size:21px;display:block;}
#stars-box{display:flex;align-items:center;gap:6px;background:#fff;border-radius:50px;padding:6px 14px;font-weight:900;font-size:19px;box-shadow:0 2px 10px rgba(0,0,0,.1);}

/* ── MENU ── */
#menu-screen{width:100%;max-width:600px;display:flex;flex-direction:column;padding:6px 14px 14px;gap:10px;}
#menu-title{font-family:'Fredoka One',cursive;font-size:26px;text-align:center;color:#aaa;padding:4px 0;}
#menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cat-card{border:none;border-radius:22px;padding:14px 12px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.15);transition:transform .15s;color:#fff;font-family:'Fredoka One',cursive;}
.cat-card:active{transform:scale(.94);}
.cc-icons{display:flex;gap:4px;font-size:38px;line-height:1;}
.cc-title{font-size:21px;}

/* ── GAME SCREEN ── */
/* Left and right padding = 90px to keep content clear of the fixed edge buttons */
#game-screen{
  width:100%;
  max-width:100%;
  display:none;
  flex-direction:column;
  align-items:center;
  padding:4px 100px 12px;
  gap:8px;
  min-height:100dvh;
}

/* top row: back + progress */
#top-row{width:100%;display:flex;align-items:center;gap:10px;}
#btn-back{background:none;border:none;font-size:28px;cursor:pointer;padding:2px 4px;border-radius:10px;flex-shrink:0;}
#prog-wrap{flex:1;height:12px;background:#e8e8e8;border-radius:8px;overflow:hidden;}
#prog-bar{height:100%;border-radius:8px;transition:width .5s ease;width:0%;}

/* ── CARD — arrows live inside here ── */
#main-card{
  width:100%;
  max-width:500px;
  min-height:260px;
  border-radius:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:16px 60px;   /* horizontal padding keeps content away from arrow buttons */
  box-shadow:0 8px 32px rgba(0,0,0,.12);
  background:#fff;
  position:relative;
  overflow:hidden;
  border-top:8px solid #FF6B6B;
  transition:border-top-color .3s;
}

/* ◀ ▶ arrows inside card, vertically centred */
.btn-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;height:48px;
  border-radius:50%;border:none;
  font-size:20px;cursor:pointer;
  background:rgba(0,0,0,.07);
  color:#888;
  transition:background .15s,transform .15s;
  display:flex;align-items:center;justify-content:center;
}
.btn-arrow:active{background:rgba(0,0,0,.18);transform:translateY(-50%) scale(.88);}
#btn-prev{left:8px;}
#btn-next{right:8px;}

#main-emoji{font-size:110px;line-height:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
#main-word{font-family:'Fredoka One',cursive;font-size:44px;text-transform:uppercase;text-align:center;transition:color .3s;}
#syl-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:36px;align-items:center;}
.syl{font-family:'Fredoka One',cursive;font-size:23px;padding:3px 9px;border-radius:10px;background:#f1f3f5;color:#bbb;transition:background .15s,transform .2s;}
.syl.lit{background:#FFA94D;color:#fff;transform:scale(1.18);}

/* wave */
#wave{display:flex;align-items:flex-end;gap:4px;height:22px;opacity:0;transition:opacity .25s;}
#wave.on{opacity:1;}
.wb{width:5px;border-radius:3px;animation:wv .75s ease-in-out infinite;}
.wb:nth-child(1){height:8px;animation-delay:0s}
.wb:nth-child(2){height:16px;animation-delay:.12s}
.wb:nth-child(3){height:22px;animation-delay:.24s}
.wb:nth-child(4){height:14px;animation-delay:.36s}
.wb:nth-child(5){height:8px;animation-delay:.48s}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* feedback overlay */
#feedback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:28px;pointer-events:none;opacity:0;transition:opacity .25s;}
#feedback.show{opacity:1;}
#fb-emoji{font-size:70px;}
#fb-text{font-family:'Fredoka One',cursive;font-size:28px;color:#fff;text-align:center;padding:0 12px;}

/* ── STATUS ── */
#status-text{font-family:'Fredoka One',cursive;font-size:17px;color:#aaa;text-align:center;text-transform:uppercase;min-height:24px;width:100%;max-width:500px;}

/* ════════════════════════════════════
   HEAR (🔊) and SPEAK (🎤) buttons
   Always fixed to screen edges.
   Works in portrait AND landscape — no media queries needed.
════════════════════════════════════ */
#btn-listen{
  position:fixed;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:86px;height:86px;
  border-radius:0 50px 50px 0;   /* flat on left, rounded on right */
  border:none;font-size:38px;
  cursor:pointer;
  background:#FFA94D;color:#fff;
  box-shadow:4px 0 20px rgba(255,169,77,.5);
  transition:background .2s,transform .15s;
  z-index:100;
  display:flex;align-items:center;justify-content:center;
}
#btn-listen:active{transform:translateY(-50%) scale(.9);}
#btn-listen.speaking{background:#339AF0;}

#btn-mic{
  position:fixed;
  right:0;
  top:50%;
  transform:translateY(-50%);
  width:92px;height:92px;
  border-radius:50px 0 0 50px;   /* rounded on left, flat on right */
  border:none;font-size:44px;
  cursor:pointer;
  background:#FF6B6B;color:#fff;
  box-shadow:-4px 0 20px rgba(255,107,107,.5);
  transition:background .2s,transform .15s,opacity .2s;
  z-index:100;
  display:flex;align-items:center;justify-content:center;
}
#btn-mic:active:not(:disabled){transform:translateY(-50%) scale(.9);}
#btn-mic.listening{background:#339AF0;animation:pulse .9s ease-out infinite;}
#btn-mic.success{background:#51CF66;}
#btn-mic:disabled{opacity:.28;cursor:not-allowed;animation:none !important;}
@keyframes pulse{
  0%{box-shadow:-4px 0 20px rgba(51,154,240,.8),0 0 0 0 rgba(51,154,240,.6)}
  70%{box-shadow:-4px 0 20px rgba(51,154,240,.4),0 0 0 22px rgba(51,154,240,0)}
  100%{box-shadow:-4px 0 20px rgba(51,154,240,.8),0 0 0 0 rgba(51,154,240,0)}
}

/* confetti */
.cf{position:fixed;width:12px;height:12px;pointer-events:none;z-index:200;animation:cff 1.5s ease-in forwards;}
@keyframes cff{from{transform:translateY(-40px) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(760deg);opacity:0}}

/* streak */
#streak{position:fixed;top:56px;right:100px;background:#FFA94D;color:#fff;font-family:'Fredoka One',cursive;font-size:18px;border-radius:50px;padding:6px 14px;box-shadow:0 4px 16px rgba(255,169,77,.5);transform:scale(0);transition:transform .4s cubic-bezier(.4,0,.2,1);z-index:50;}
#streak.on{transform:scale(1);}

/* ── DEBUG PANEL ── */
#debug-panel{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.82);color:#0f0;
  font-family:monospace;font-size:13px;
  padding:8px 12px;z-index:999;
  display:none;
  max-height:140px;overflow-y:auto;
}
#debug-panel.on{display:block;}
#debug-toggle{
  position:fixed;bottom:4px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.5);color:#fff;
  border:none;border-radius:20px;padding:4px 14px;
  font-size:11px;cursor:pointer;z-index:1000;
}
</style>
</head>

</div>

<!-- FIXED EDGE BUTTONS — always visible regardless of orientation -->
<button id="btn-listen">🔊</button>
<button id="btn-mic" disabled>🎤</button>

<div id="streak">🔥 <span id="streak-n">3</span> IN A ROW!</div>

<script>
const CATS={
  animals:{label:"ANIMALS",color:"#FF6B6B",preview:["🐶","🐱","🦁"],words:[
    {w:"dog",e:"🐶",s:["DOG"]},{w:"cat",e:"🐱",s:["CAT"]},{w:"lion",e:"🦁",s:["LI","ON"]},
    {w:"bird",e:"🐦",s:["BIRD"]},{w:"fish",e:"🐟",s:["FISH"]},{w:"rabbit",e:"🐰",s:["RAB","BIT"]},

    {w:"four",e:"4️⃣",s:["FOUR"]},{w:"five",e:"5️⃣",s:["FIVE"]},{w:"six",e:"6️⃣",s:["SIX"]},
    {w:"seven",e:"7️⃣",s:["SEV","EN"]},{w:"eight",e:"8️⃣",s:["EIGHT"]},{w:"nine",e:"9️⃣",s:["NINE"]},{w:"ten",e:"🔟",s:["TEN"]},
  ]},
  body:{label:"BODY",color:"#51CF66",preview:["👁️","👂","✋"],words:[
    {w:"eye",e:"👁️",s:["EYE"]},{w:"ear",e:"👂",s:["EAR"]},{w:"nose",e:"👃",s:["NOSE"]},
    {w:"mouth",e:"👄",s:["MOUTH"]},{w:"hand",e:"✋",s:["HAND"]},{w:"foot",e:"🦶",s:["FOOT"]},
    {w:"heart",e:"❤️",s:["HEART"]},{w:"arm",e:"💪",s:["ARM"]},{w:"leg",e:"🦵",s:["LEG"]},{w:"hair",e:"💇",s:["HAIR"]},
  ]},
  home:{label:"HOME",color:"#F06595",preview:["🏠","🛏️","📚"],words:[
    {w:"house",e:"🏠",s:["HOUSE"]},{w:"door",e:"🚪",s:["DOOR"]},{w:"bed",e:"🛏️",s:["BED"]},
    {w:"book",e:"📚",s:["BOOK"]},{w:"chair",e:"🪑",s:["CHAIR"]},{w:"lamp",e:"💡",s:["LAMP"]},
    {w:"clock",e:"🕐",s:["CLOCK"]},{w:"key",e:"🔑",s:["KEY"]},{w:"cup",e:"☕",s:["CUP"]},{w:"phone",e:"📱",s:["PHONE"]},
  ]},
  nature:{label:"NATURE",color:"#20C997",preview:["☀️","🌳","❄️"],words:[
    {w:"sun",e:"☀️",s:["SUN"]},{w:"moon",e:"🌙",s:["MOON"]},{w:"tree",e:"🌳",s:["TREE"]},
    {w:"snow",e:"❄️",s:["SNOW"]},{w:"rain",e:"🌧️",s:["RAIN"]},{w:"star",e:"⭐",s:["STAR"]},
    {w:"flower",e:"🌸",s:["FLOW","ER"]},{w:"cloud",e:"☁️",s:["CLOUD"]},{w:"fire",e:"🔥",s:["FIRE"]},{w:"leaf",e:"🍃",s:["LEAF"]},
  ]},
  clothes:{label:"CLOTHES",color:"#845EF7",preview:["👕","👟","🎩"],words:[
    {w:"shirt",e:"👕",s:["SHIRT"]},{w:"shoes",e:"👟",s:["SHOES"]},{w:"hat",e:"🎩",s:["HAT"]},
    {w:"pants",e:"👖",s:["PANTS"]},{w:"socks",e:"🧦",s:["SOCKS"]},{w:"dress",e:"👗",s:["DRESS"]},
    {w:"jacket",e:"🧥",s:["JACK","ET"]},{w:"gloves",e:"🧤",s:["GLOVES"]},{w:"scarf",e:"🧣",s:["SCARF"]},
  ]},
};

let cat=null,deck=[],idx=0,stars=0,streak=0,streakTimer=null;
let listening=false,busy=false,attempts=0;
const synth=window.speechSynthesis;
let voices=[];
function loadVoices(){voices=synth.getVoices();}
loadVoices();
if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
function pickVoice(){
  return voices.find(v=>v.lang==='en-US'&&v.localService)
      ||voices.find(v=>v.lang.startsWith('en')&&v.localService)
      ||voices.find(v=>v.lang==='en-US')
      ||voices.find(v=>v.lang.startsWith('en'))||null;
}

/* SPLASH */
document.getElementById('splash').addEventListener('click',function(){
  synth.cancel();
  const u=new SpeechSynthesisUtterance('.');
  u.volume=0.001;u.rate=10;synth.speak(u);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)
    navigator.mediaDevices.getUserMedia({audio:true,video:false})
      .then(s=>s.getTracks().forEach(t=>t.stop())).catch(()=>{});
  this.style.display='none';
  buildMenu();
},{once:true});

/* TTS */
function speak(text,rate,pitch,onDone){
  synth.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate||0.88;u.pitch=pitch||1.1;u.volume=1.0;
    const v=pickVoice();if(v)u.voice=v;
    const wave=document.getElementById('wave');
    const bl=document.getElementById('btn-listen');
    u.onstart=()=>{wave.classList.add('on');bl.classList.add('speaking');};
    u.onend=()=>{wave.classList.remove('on');bl.classList.remove('speaking');if(onDone)onDone();};
    u.onerror=()=>{wave.classList.remove('on');bl.classList.remove('speaking');if(onDone)onDone();};
    synth.speak(u);
  },55);
}

function speakSyllables(syls,done){
  synth.cancel();
  let i=0;
  const wave=document.getElementById('wave');
  function next(){
    if(i>=syls.length){renderSyls(syls,-1);setTimeout(done,380);return;}
    renderSyls(syls,i);
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(syls[i]);
      u.lang='en-US';u.rate=0.52;u.pitch=1.2;u.volume=1.0;
      const v=pickVoice();if(v)u.voice=v;
      u.onstart=()=>wave.classList.add('on');
      u.onend=()=>{wave.classList.remove('on');i++;setTimeout(next,400);};
      u.onerror=()=>{wave.classList.remove('on');i++;setTimeout(next,400);};
      synth.speak(u);
    },55);
  }
  next();
}

/* SPEECH RECOGNITION */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null;
function startListening(){
  if(listening||busy)return;
  if(!SR){setStatus('SPEECH RECOGNITION NOT AVAILABLE');return;}
  synth.cancel();
  recog=new SR();
  recog.lang='en-US';recog.continuous=false;recog.interimResults=true;recog.maxAlternatives=6;

  let interimBest=''; // capture interim transcripts before final

  recog.onresult=e=>{
    const results=e.results[e.results.length-1];
    const alts=[...results].map(a=>a.transcript.trim().toLowerCase()).filter(a=>a!=='');
    console.log('RAW RESULT:',alts,'isFinal:',results.isFinal);

    // always save interim — Chrome may not produce a final for short words
    if(alts.length>0) interimBest=alts[0];

    if(results.isFinal){
      listening=false;setMicState('idle');
      if(alts.length===0&&interimBest){
        console.log('Final empty, using saved interim:',interimBest);
        evaluate([interimBest]);
      } else if(alts.length>0){
        evaluate(alts);
      } else {
        setStatus("DIDN'T HEAR YOU — TRY AGAIN!");
        enableMic(true);
      }
    }
  };

  recog.onnomatch=e=>{
    listening=false;setMicState('idle');
    console.log('NO MATCH — interim was:',interimBest);
    // if we captured any interim audio, use it
    if(interimBest){
      evaluate([interimBest]);
    } else {
      attempts++;
      onWrong(attempts);
    }
    interimBest='';
  };

  recog.onerror=e=>{
    listening=false;setMicState('idle');
    console.log('ERROR:',e.error,'interim:',interimBest);
    if(e.error==='not-allowed') setStatus('PLEASE ALLOW THE MICROPHONE');
    else if(e.error==='no-speech'){
      if(interimBest){ evaluate([interimBest]); }
      else{ setStatus("DIDN'T HEAR YOU — TRY AGAIN!"); enableMic(true); }
    }
    else if(e.error==='network') setStatus('NEED INTERNET FOR VOICE');
    else{ setStatus('TRY AGAIN!'); enableMic(true); }
    interimBest='';
  };

  recog.onend=e=>{
    console.log('RECOGNITION ENDED, listening:',listening,'interim:',interimBest);
    if(listening){
      listening=false; setMicState('idle');
      if(interimBest){ evaluate([interimBest]); }
      else{ enableMic(true); }
      interimBest='';
    }
  };
  try{recog.start();listening=true;setMicState('listening');setStatus('LISTENING...');}
  catch(e){listening=false;}
}
function stopListening(){
  if(recog){try{recog.abort();}catch(e){}recog=null;}
  listening=false;
}

function lev(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?j?0:i:j));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function sim(a,b){
  a=a.toLowerCase().trim();b=b.toLowerCase().trim();
  if(a===b)return 1;
  const L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1;
}

function evaluate(alts){
  if(busy)return;
  const target=deck[idx].w.toLowerCase();
  let best=0;

  alts.forEach(h=>{
    // full phrase match
    best=Math.max(best,sim(target,h));
    // token by token (catches "a duck", "the bee")
    h.split(/\s+/).forEach(t=>{best=Math.max(best,sim(target,t));});
    // strip leading article
    const stripped=h.replace(/^(a |an |the )/i,'').trim();
    best=Math.max(best,sim(target,stripped));
  });

  // alias check
  if(best<0.8){
    const al=ALIASES[target]||[];
    alts.forEach(h=>{
      const ht=h.trim();
      if(al.includes(ht))best=1;
      // single letter returned (e.g. "B" for bee)
      if(ht.length===1 && ht.toLowerCase()===target[0])best=0.85;
      h.split(/\s+/).forEach(t=>{if(al.includes(t))best=1;});
      // stripped alias check
      const stripped=h.replace(/^(a |an |the )/i,'').trim();
      if(al.includes(stripped))best=1;
    });
  }

  // threshold: single-syllable short words are harder to recognise accurately
  // words with 4 or fewer letters get 0.55 threshold, others 0.75
  const charLen=target.replace(/\s/g,'').length;
  const threshold = charLen<=4 ? 0.55 : charLen<=6 ? 0.68 : 0.75;

  console.log('heard:',alts,'| target:',target,'| score:',best.toFixed(2),'| threshold:',threshold);
  // show in on-screen debug panel
  const dp=document.getElementById('debug-panel');
  dp.innerHTML='<b>HEARD:</b> '+alts.join(' / ')+'<br><b>TARGET:</b> '+target+'<br><b>SCORE:</b> '+best.toFixed(2)+' (need '+threshold+')<br><b>RESULT:</b> '+(best>=threshold?'✅ PASS':'❌ FAIL')+'<hr>'+dp.innerHTML;
  best>=threshold?onCorrect():(attempts++,onWrong(attempts));
}

/* MENU */
function buildMenu(){
  const grid=document.getElementById('menu-grid');
  grid.innerHTML='';
  Object.entries(CATS).forEach(([key,c])=>{
    const btn=document.createElement('button');
    btn.className='cat-card';btn.style.background=c.color;
    btn.innerHTML=`<div class="cc-icons">${c.preview.join('')}</div><div class="cc-title">${c.label}</div>`;
    btn.onclick=()=>startGame(key);
    grid.appendChild(btn);
  });
}

/* GAME */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}

function startGame(key){
  cat=key;deck=shuffle(CATS[key].words);idx=0;attempts=0;busy=false;
  document.getElementById('topbar').style.display='none';
  document.getElementById('menu-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  const color=CATS[key].color;
  document.getElementById('main-card').style.borderTopColor=color;
  document.getElementById('prog-bar').style.background=color;
  document.getElementById('main-word').style.color=color;
  document.querySelectorAll('.wb').forEach(b=>b.style.background=color);
  showCard();
}

function showCard(){
  stopListening();hideFeedback();attempts=0;busy=false;
  const item=deck[idx];
  document.getElementById('main-emoji').textContent=item.e;
  document.getElementById('main-emoji').style.transform='scale(1)';
  document.getElementById('main-word').textContent=item.w.toUpperCase();
  renderSyls(item.s,-1);
  updateProg();
  setMicState('idle');enableMic(false);
  setStatus('LISTEN FIRST! 🔊');
  setTimeout(()=>speak(item.w,0.88,1.1,()=>{enableMic(true);setStatus('NOW SAY THE WORD! 🎤');}),500);
}

function navPrev(){if(busy)return;synth.cancel();stopListening();idx=(idx-1+deck.length)%deck.length;showCard();}
function navNext(){if(busy)return;synth.cancel();stopListening();idx=(idx+1)%deck.length;showCard();}

function renderSyls(syls,lit){
  const row=document.getElementById('syl-row');
  if(syls.length<=1){row.innerHTML='';return;}
  row.innerHTML=syls.map((s,i)=>`<span class="syl${i===lit?' lit':''}">${s}</span>`).join('');
}
function updateProg(){
  document.getElementById('prog-bar').style.width=(deck.length?(idx+1)/deck.length*100:0)+'%';
}
function enableMic(on){document.getElementById('btn-mic').disabled=!on;}

/* CORRECT */
function onCorrect(){
  if(busy)return;busy=true;
  streak++;stars+=10;
  document.getElementById('stars').textContent=stars;
  document.getElementById('stars-game').textContent=stars;
  setMicState('success');setStatus('GREAT JOB! 🎉');
  showFeedback('✅','AMAZING!','#51CF66');
  confetti();showStreak();
  const em=document.getElementById('main-emoji');
  em.style.transform='scale(1.4)';
  setTimeout(()=>em.style.transform='scale(1)',350);
  setTimeout(()=>{hideFeedback();idx++;if(idx>=deck.length)finishGame();else showCard();},1900);
}

/* WRONG */
function onWrong(n){
  streak=0;document.getElementById('streak').classList.remove('on');
  const item=deck[idx];
  enableMic(false);
  if(n===1){
    setStatus('LISTEN CAREFULLY!');
    showFeedback('👂','LISTEN AGAIN!','#FFA94D');
    setTimeout(()=>{hideFeedback();speak(item.w,0.6,1.1,()=>{enableMic(true);setStatus('TRY AGAIN! 🎤');});},700);
  } else {
    setStatus('LISTEN TO EACH PART!');
    showFeedback('🔤','SAY EACH PART!','#CC5DE8');
    setTimeout(()=>{
      hideFeedback();
      speakSyllables(item.s,()=>{speak(item.w,0.65,1.1,()=>{enableMic(true);setStatus('TRY AGAIN! 🎤');});});
    },700);
  }
}

/* FINISH */
function finishGame(){
  showFeedback('🏆','YOU DID IT! 🎉','#FFA94D');
  confetti();confetti();
  setTimeout(()=>{hideFeedback();goMenu();},3000);
}

/* UI HELPERS */
function setStatus(t){document.getElementById('status-text').textContent=t;}
function setMicState(s){
  const b=document.getElementById('btn-mic');
  b.classList.remove('listening','success');
  if(s==='listening'){b.classList.add('listening');b.textContent='👂';}
  else if(s==='success'){b.classList.add('success');b.textContent='✅';}
  else{b.textContent='🎤';}
}
function showFeedback(emoji,text,color){
  document.getElementById('fb-emoji').textContent=emoji;
  document.getElementById('fb-text').textContent=text;
  const fb=document.getElementById('feedback');
  fb.style.background=color+'EE';fb.classList.add('show');
}
function hideFeedback(){document.getElementById('feedback').classList.remove('show');}
function showStreak(){
  if(streak<3)return;
  const el=document.getElementById('streak');
  document.getElementById('streak-n').textContent=streak;
  el.classList.add('on');clearTimeout(streakTimer);
  streakTimer=setTimeout(()=>el.classList.remove('on'),2500);
}
function confetti(){
  const cols=['#FF6B6B','#FFA94D','#CC5DE8','#339AF0','#51CF66','#F06595','#20C997','#845EF7'];
  for(let i=0;i<30;i++)setTimeout(()=>{
    const el=document.createElement('div');el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;background:${cols[0|Math.random()*cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.1+Math.random()*.9}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),2300);
  },i*42);
}
function goMenu(){
  stopListening();synth.cancel();busy=false;hideFeedback();
  document.getElementById('game-screen').style.display='none';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('menu-screen').style.display='flex';
}

/* EVENTS */
document.getElementById('btn-listen').addEventListener('click',()=>{
  if(!deck.length)return;
  enableMic(false);
  speak(deck[idx].w,0.88,1.1,()=>{enableMic(true);setStatus('NOW SAY THE WORD! 🎤');});
});
document.getElementById('btn-mic').addEventListener('click',()=>{
  if(listening){stopListening();return;}
  startListening();
});
document.getElementById('btn-back').addEventListener('click',()=>{synth.cancel();goMenu();});
document.getElementById('btn-prev').addEventListener('click',navPrev);
document.getElementById('btn-next').addEventListener('click',navNext);
document.addEventListener('keydown',e=>{
  if(document.getElementById('game-screen').style.display==='none')return;
  if(e.key===' '){e.preventDefault();listening?stopListening():startListening();}
  if(e.key==='ArrowRight')navNext();
  if(e.key==='ArrowLeft')navPrev();
  if(e.key==='r'||e.key==='R'){enableMic(false);speak(deck[idx].w,0.88,1.1,()=>enableMic(true));}
});
</script>
