<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="English vocabulary flashcards for kids — audio, voice recognition, syllable breakdown">
<meta name="theme-color" content="#FF6B6B">
<title>English Flashcards 4 Kids v1.4.0</title>
<meta name="version" content="1.4.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:#FFF9F0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}

/* SPLASH */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#FF6B6B 0%,#FF8E53 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;cursor:pointer;user-select:none;}
.sp-emoji{font-size:100px;animation:bob 1.1s ease-in-out infinite alternate;}
.sp-title{font-family:'Fredoka One',cursive;font-size:36px;color:#fff;text-align:center;line-height:1.2;}
.sp-title span{font-size:48px;display:block;}
.sp-sub{font-family:'Fredoka One',cursive;font-size:22px;color:rgba(255,255,255,.85);text-align:center;padding:0 24px;animation:blink 1.4s ease-in-out infinite;}
@keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-16px) scale(1.05)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

/* TOP BAR */
#topbar{width:100%;max-width:700px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px 4px;}
#logo{font-family:'Fredoka One',cursive;font-size:17px;color:#FF6B6B;line-height:1.2;}
#logo span{font-size:21px;display:block;}
#stars-box{display:flex;align-items:center;gap:6px;background:#fff;border-radius:50px;padding:6px 14px;font-weight:900;font-size:19px;box-shadow:0 2px 10px rgba(0,0,0,.1);}

/* MENU */
#menu-screen{width:100%;max-width:700px;display:flex;flex-direction:column;padding:6px 14px 14px;gap:10px;}
#menu-title{font-family:'Fredoka One',cursive;font-size:26px;text-align:center;color:#aaa;padding:4px 0;}
#menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cat-card{border:none;border-radius:22px;padding:14px 12px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.15);transition:transform .15s,box-shadow .15s;color:#fff;font-family:'Fredoka One',cursive;}
.cat-card:hover{transform:scale(1.03);}
.cat-card:active{transform:scale(.94);}
.cc-icons{display:flex;gap:4px;font-size:38px;line-height:1;}
.cc-title{font-size:21px;}

/* GAME — portrait default */
#game-screen{width:100%;max-width:700px;display:none;flex-direction:column;align-items:center;padding:4px 14px 10px;gap:6px;}
#top-row{width:100%;display:flex;align-items:center;justify-content:space-between;}
#btn-back{background:none;border:none;font-size:32px;cursor:pointer;padding:2px 6px;border-radius:12px;}
#prog-wrap{flex:1;height:12px;background:#e8e8e8;border-radius:8px;overflow:hidden;margin:0 10px;}
#prog-bar{height:100%;border-radius:8px;transition:width .5s ease;width:0%;}

/* CARD */
#main-card{width:100%;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 18px;box-shadow:0 8px 32px rgba(0,0,0,.12);background:#fff;position:relative;overflow:hidden;border-top:8px solid #FF6B6B;transition:border-top-color .3s;flex:1;min-height:220px;}
#main-emoji{font-size:110px;line-height:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
#main-word{font-family:'Fredoka One',cursive;font-size:44px;text-transform:uppercase;text-align:center;transition:color .3s;}
#syl-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:38px;align-items:center;}
.syl{font-family:'Fredoka One',cursive;font-size:24px;padding:3px 10px;border-radius:10px;background:#f1f3f5;color:#bbb;transition:background .15s,transform .2s;}
.syl.lit{background:#FFA94D;color:#fff;transform:scale(1.2);}
#wave{display:flex;align-items:flex-end;gap:4px;height:24px;opacity:0;transition:opacity .25s;}
#wave.on{opacity:1;}
.wb{width:5px;border-radius:3px;animation:wv .75s ease-in-out infinite;}
.wb:nth-child(1){height:9px;animation-delay:0s}
.wb:nth-child(2){height:18px;animation-delay:.12s}
.wb:nth-child(3){height:24px;animation-delay:.24s}
.wb:nth-child(4){height:16px;animation-delay:.36s}
.wb:nth-child(5){height:9px;animation-delay:.48s}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
#feedback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:28px;pointer-events:none;opacity:0;transition:opacity .25s;}
#feedback.show{opacity:1;}
#fb-emoji{font-size:76px;}
#fb-text{font-family:'Fredoka One',cursive;font-size:32px;color:#fff;text-align:center;}

/* CONTROLS — portrait */
#controls{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;}
#status-text{font-family:'Fredoka One',cursive;font-size:17px;color:#aaa;text-align:center;text-transform:uppercase;min-height:24px;}

/* button row: prev | listen | mic | next */
#btn-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 6px;}

/* NAV arrows */
.btn-nav{width:60px;height:60px;border-radius:50%;border:none;font-size:26px;cursor:pointer;background:#f1f3f5;color:#aaa;box-shadow:0 3px 10px rgba(0,0,0,.1);transition:transform .15s,background .15s;}
.btn-nav:active{transform:scale(.88);}
.btn-nav:hover{background:#e8e8e8;}

/* LISTEN */
#btn-listen{width:88px;height:88px;border-radius:50%;border:none;font-size:40px;cursor:pointer;background:#FFA94D;color:#fff;box-shadow:0 5px 18px rgba(255,169,77,.45);transition:transform .15s,background .2s;}
#btn-listen:active{transform:scale(.88);}
#btn-listen.speaking{background:#339AF0;}

/* MIC */
#btn-mic{width:110px;height:110px;border-radius:50%;border:none;font-size:52px;cursor:pointer;background:#FF6B6B;color:#fff;box-shadow:0 6px 24px rgba(255,107,107,.45);transition:transform .15s,background .2s,opacity .2s;}
#btn-mic:active:not(:disabled){transform:scale(.88);}
#btn-mic.listening{background:#339AF0;animation:pulse .9s ease-out infinite;}
#btn-mic.success{background:#51CF66;}
#btn-mic:disabled{opacity:.3;cursor:not-allowed;animation:none !important;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(51,154,240,.7)}70%{box-shadow:0 0 0 28px rgba(51,154,240,0)}100%{box-shadow:0 0 0 0 rgba(51,154,240,0)}}

/* confetti */
.cf{position:fixed;width:12px;height:12px;pointer-events:none;z-index:200;animation:cff 1.5s ease-in forwards;}
@keyframes cff{from{transform:translateY(-40px) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(760deg);opacity:0}}

/* streak */
#streak{position:fixed;top:60px;right:14px;background:#FFA94D;color:#fff;font-family:'Fredoka One',cursive;font-size:20px;border-radius:50px;padding:8px 16px;box-shadow:0 4px 18px rgba(255,169,77,.5);transform:scale(0) translateX(40px);transition:transform .4s cubic-bezier(.4,0,.2,1);z-index:50;}
#streak.on{transform:scale(1) translateX(0);}

/* ═══════════════════════════════════════
   TABLET LANDSCAPE
   When width > 700px AND landscape:
   - card fills center column
   - listen btn pinned far left edge
   - mic btn pinned far right edge
═══════════════════════════════════════ */
@media (min-width:700px) and (orientation:landscape){
  body{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  #topbar{max-width:100%;padding:10px 24px 4px;}
  #menu-screen{max-width:100%;}
  #menu-grid{grid-template-columns:repeat(4,1fr);}

  #game-screen{
    max-width:100%;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    padding:8px 0 12px;
    gap:0;
    position:relative;
    min-height:calc(100dvh - 60px);
  }
  #top-row{
    width:100%;
    padding:0 24px;
    margin-bottom:6px;
  }
  #main-card{
    width:50vw;
    max-width:480px;
    min-height:60vh;
    flex:none;
  }
  /* hide the normal control strip in landscape */
  #controls{ display:none !important; }

  /* listen — fixed to left edge, vertically centred */
  #btn-listen{
    position:fixed;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:100px;
    height:100px;
    font-size:46px;
    z-index:10;
  }
  #btn-listen.speaking{background:#339AF0;}

  /* mic — fixed to right edge, vertically centred */
  #btn-mic{
    position:fixed;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:120px;
    height:120px;
    font-size:56px;
    z-index:10;
  }
  #btn-mic.listening{background:#339AF0;animation:pulse .9s ease-out infinite;}
  #btn-mic.success{background:#51CF66;}
  #btn-mic:disabled{opacity:.3;cursor:not-allowed;animation:none !important;}

  /* nav arrows flanking the card */
  #btn-prev-ls, #btn-next-ls{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:72px;height:72px;
    border-radius:50%;border:none;
    font-size:30px;cursor:pointer;
    background:#f1f3f5;color:#aaa;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
    z-index:10;
    transition:transform .15s,background .15s;
  }
  #btn-prev-ls{ left:136px; }
  #btn-next-ls{ right:156px; }
  #btn-prev-ls:active,#btn-next-ls:active{transform:translateY(-50%) scale(.88);}
  #btn-prev-ls:hover,#btn-next-ls:hover{background:#e0e0e0;}

  /* status text below card */
  #status-ls{
    display:block !important;
    font-family:'Fredoka One',cursive;
    font-size:18px;color:#aaa;
    text-transform:uppercase;
    text-align:center;
    width:100%;
    margin-top:8px;
  }
}

/* hidden in portrait */
#btn-prev-ls,#btn-next-ls,#status-ls{ display:none; }
</style>
</head>
<body>

<div id="splash">
  <div class="sp-emoji">🌍</div>
  <div class="sp-title"><span>ENGLISH</span>FLASHCARDS 4 KIDS</div>
  <div class="sp-sub">👆 TAP TO START!</div>
</div>

<div id="topbar">
  <div id="logo"><span>ENGLISH</span>FLASHCARDS 4 KIDS</div>
  <div id="stars-box">⭐ <span id="stars">0</span></div>
</div>

<div id="menu-screen">
  <div id="menu-title">PICK A CATEGORY!</div>
  <div id="menu-grid"></div>
</div>

<div id="game-screen">
  <!-- top row: back + progress bar -->
  <div id="top-row">
    <button id="btn-back">⬅️</button>
    <div id="prog-wrap"><div id="prog-bar"></div></div>
  </div>

  <!-- main card -->
  <div id="main-card">
    <div id="main-emoji">🐶</div>
    <div id="main-word">DOG</div>
    <div id="syl-row"></div>
    <div id="wave">
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div><div class="wb"></div>
    </div>
    <div id="feedback"><div id="fb-emoji"></div><div id="fb-text"></div></div>
  </div>

  <!-- landscape-only status text -->
  <div id="status-ls">LISTEN FIRST!</div>

  <!-- portrait controls -->
  <div id="controls">
    <div id="status-text">LISTEN FIRST! 🔊</div>
    <div id="btn-row">
      <button class="btn-nav" id="btn-prev" title="Previous word">◀</button>
      <button id="btn-listen" title="Hear the word">🔊</button>
      <button id="btn-mic" disabled title="Say the word">🎤</button>
      <button class="btn-nav" id="btn-next" title="Next word">▶</button>
    </div>
  </div>

  <!-- landscape fixed buttons (shown via CSS in landscape) -->
  <button id="btn-prev-ls" title="Previous word">◀</button>
  <button id="btn-next-ls" title="Next word">▶</button>
</div>

<div id="streak">🔥 <span id="streak-n">3</span> IN A ROW!</div>

<script>
const CATS = {
  animals:{label:"ANIMALS",color:"#FF6B6B",preview:["🐶","🐱","🦁"],words:[
    {w:"dog",e:"🐶",s:["DOG"]},{w:"cat",e:"🐱",s:["CAT"]},{w:"lion",e:"🦁",s:["LI","ON"]},
    {w:"bird",e:"🐦",s:["BIRD"]},{w:"fish",e:"🐟",s:["FISH"]},{w:"rabbit",e:"🐰",s:["RAB","BIT"]},
    {w:"elephant",e:"🐘",s:["EL","E","PHANT"]},{w:"monkey",e:"🐒",s:["MON","KEY"]},
    {w:"frog",e:"🐸",s:["FROG"]},{w:"horse",e:"🐴",s:["HORSE"]},{w:"duck",e:"🦆",s:["DUCK"]},
    {w:"sheep",e:"🐑",s:["SHEEP"]},{w:"pig",e:"🐷",s:["PIG"]},{w:"cow",e:"🐄",s:["COW"]},{w:"bee",e:"🐝",s:["BEE"]},
  ]},
  food:{label:"FOOD",color:"#FFA94D",preview:["🍎","🍕","🍦"],words:[
    {w:"apple",e:"🍎",s:["AP","PLE"]},{w:"pizza",e:"🍕",s:["PIZ","ZA"]},{w:"ice cream",e:"🍦",s:["ICE","CREAM"]},
    {w:"banana",e:"🍌",s:["BA","NA","NA"]},{w:"cake",e:"🎂",s:["CAKE"]},{w:"cookie",e:"🍪",s:["COO","KIE"]},
    {w:"bread",e:"🍞",s:["BREAD"]},{w:"milk",e:"🥛",s:["MILK"]},{w:"egg",e:"🥚",s:["EGG"]},
    {w:"cheese",e:"🧀",s:["CHEESE"]},{w:"orange",e:"🍊",s:["OR","ANGE"]},{w:"carrot",e:"🥕",s:["CAR","ROT"]},
  ]},
  colors:{label:"COLORS",color:"#CC5DE8",preview:["🟥","🟦","🟨"],words:[
    {w:"red",e:"🟥",s:["RED"]},{w:"blue",e:"🟦",s:["BLUE"]},{w:"yellow",e:"🟨",s:["YEL","LOW"]},
    {w:"green",e:"🟩",s:["GREEN"]},{w:"orange",e:"🟧",s:["OR","ANGE"]},{w:"purple",e:"🟪",s:["PUR","PLE"]},
    {w:"pink",e:"🩷",s:["PINK"]},{w:"white",e:"⬜",s:["WHITE"]},{w:"black",e:"⬛",s:["BLACK"]},{w:"brown",e:"🟫",s:["BROWN"]},
  ]},
  numbers:{label:"NUMBERS",color:"#339AF0",preview:["1️⃣","2️⃣","3️⃣"],words:[
    {w:"one",e:"1️⃣",s:["ONE"]},{w:"two",e:"2️⃣",s:["TWO"]},{w:"three",e:"3️⃣",s:["THREE"]},
    {w:"four",e:"4️⃣",s:["FOUR"]},{w:"five",e:"5️⃣",s:["FIVE"]},{w:"six",e:"6️⃣",s:["SIX"]},
    {w:"seven",e:"7️⃣",s:["SEV","EN"]},{w:"eight",e:"8️⃣",s:["EIGHT"]},{w:"nine",e:"9️⃣",s:["NINE"]},{w:"ten",e:"🔟",s:["TEN"]},
  ]},
  body:{label:"BODY",color:"#51CF66",preview:["👁️","👂","✋"],words:[
    {w:"eye",e:"👁️",s:["EYE"]},{w:"ear",e:"👂",s:["EAR"]},{w:"nose",e:"👃",s:["NOSE"]},
    {w:"mouth",e:"👄",s:["MOUTH"]},{w:"hand",e:"✋",s:["HAND"]},{w:"foot",e:"🦶",s:["FOOT"]},
    {w:"heart",e:"❤️",s:["HEART"]},{w:"arm",e:"💪",s:["ARM"]},{w:"leg",e:"🦵",s:["LEG"]},{w:"hair",e:"💇",s:["HAIR"]},
  ]},
  home:{label:"HOME",color:"#F06595",preview:["🏠","🛏️","📚"],words:[
    {w:"house",e:"🏠",s:["HOUSE"]},{w:"door",e:"🚪",s:["DOOR"]},{w:"bed",e:"🛏️",s:["BED"]},
    {w:"book",e:"📚",s:["BOOK"]},{w:"chair",e:"🪑",s:["CHAIR"]},{w:"lamp",e:"💡",s:["LAMP"]},
    {w:"clock",e:"🕐",s:["CLOCK"]},{w:"key",e:"🔑",s:["KEY"]},{w:"cup",e:"☕",s:["CUP"]},{w:"phone",e:"📱",s:["PHONE"]},
  ]},
  nature:{label:"NATURE",color:"#20C997",preview:["☀️","🌳","❄️"],words:[
    {w:"sun",e:"☀️",s:["SUN"]},{w:"moon",e:"🌙",s:["MOON"]},{w:"tree",e:"🌳",s:["TREE"]},
    {w:"snow",e:"❄️",s:["SNOW"]},{w:"rain",e:"🌧️",s:["RAIN"]},{w:"star",e:"⭐",s:["STAR"]},
    {w:"flower",e:"🌸",s:["FLOW","ER"]},{w:"cloud",e:"☁️",s:["CLOUD"]},{w:"fire",e:"🔥",s:["FIRE"]},{w:"leaf",e:"🍃",s:["LEAF"]},
  ]},
  clothes:{label:"CLOTHES",color:"#845EF7",preview:["👕","👟","🎩"],words:[
    {w:"shirt",e:"👕",s:["SHIRT"]},{w:"shoes",e:"👟",s:["SHOES"]},{w:"hat",e:"🎩",s:["HAT"]},
    {w:"pants",e:"👖",s:["PANTS"]},{w:"socks",e:"🧦",s:["SOCKS"]},{w:"dress",e:"👗",s:["DRESS"]},
    {w:"jacket",e:"🧥",s:["JACK","ET"]},{w:"gloves",e:"🧤",s:["GLOVES"]},{w:"scarf",e:"🧣",s:["SCARF"]},
  ]},
};

/* ── STATE ── */
let cat=null, deck=[], idx=0, stars=0, streak=0, streakTimer=null;
let listening=false, busy=false, attempts=0;
const synth = window.speechSynthesis;
let voices=[];
function loadVoices(){ voices=synth.getVoices(); }
loadVoices();
if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=loadVoices;
function pickVoice(){
  return voices.find(v=>v.lang==='en-US'&&v.localService)
      || voices.find(v=>v.lang.startsWith('en')&&v.localService)
      || voices.find(v=>v.lang==='en-US')
      || voices.find(v=>v.lang.startsWith('en'))
      || null;
}

/* ── SPLASH ── */
document.getElementById('splash').addEventListener('click',function(){
  synth.cancel();
  const u=new SpeechSynthesisUtterance('.');
  u.volume=0.001;u.rate=10;synth.speak(u);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)
    navigator.mediaDevices.getUserMedia({audio:true,video:false})
      .then(s=>s.getTracks().forEach(t=>t.stop())).catch(()=>{});
  this.style.display='none';
  buildMenu();
},{once:true});

/* ── TTS ── */
function speak(text,rate,pitch,onDone){
  synth.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate||0.88;u.pitch=pitch||1.1;u.volume=1.0;
    const v=pickVoice();if(v)u.voice=v;
    const wave=document.getElementById('wave');
    const bl=document.getElementById('btn-listen');
    u.onstart=()=>{wave.classList.add('on');bl.classList.add('speaking');};
    u.onend=()=>{wave.classList.remove('on');bl.classList.remove('speaking');if(onDone)onDone();};
    u.onerror=()=>{wave.classList.remove('on');bl.classList.remove('speaking');if(onDone)onDone();};
    synth.speak(u);
  },55);
}

function speakSyllables(syls,done){
  synth.cancel();
  let i=0;
  const wave=document.getElementById('wave');
  function next(){
    if(i>=syls.length){renderSyls(syls,-1);setTimeout(done,380);return;}
    renderSyls(syls,i);
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(syls[i]);
      u.lang='en-US';u.rate=0.52;u.pitch=1.2;u.volume=1.0;
      const v=pickVoice();if(v)u.voice=v;
      u.onstart=()=>wave.classList.add('on');
      u.onend=()=>{wave.classList.remove('on');i++;setTimeout(next,400);};
      u.onerror=()=>{wave.classList.remove('on');i++;setTimeout(next,400);};
      synth.speak(u);
    },55);
  }
  next();
}

/* ── SPEECH RECOGNITION ── */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null;

function startListening(){
  if(listening||busy)return;
  if(!SR){setStatus('SPEECH RECOGNITION NOT AVAILABLE');return;}
  synth.cancel();
  recog=new SR();
  recog.lang='en-US';recog.continuous=false;recog.interimResults=false;recog.maxAlternatives=6;
  recog.onresult=e=>{
    listening=false;setMicState('idle');
    const alts=[...e.results[0]].map(a=>a.transcript.trim().toLowerCase());
    evaluate(alts);
  };
  recog.onerror=e=>{
    listening=false;setMicState('idle');
    if(e.error==='not-allowed') setStatus('PLEASE ALLOW THE MICROPHONE');
    else if(e.error==='no-speech') setStatus("I DIDN'T HEAR YOU — TRY AGAIN!");
    else if(e.error==='network') setStatus('NEED INTERNET FOR VOICE');
    else setStatus('TRY AGAIN!');
    enableMic(true);
  };
  recog.onend=()=>{listening=false;};
  try{recog.start();listening=true;setMicState('listening');setStatus('LISTENING...');}
  catch(e){listening=false;}
}

function stopListening(){
  if(recog){try{recog.abort();}catch(e){}recog=null;}
  listening=false;
}

/* ── FUZZY MATCH ──
   Strategy:
   1. Levenshtein on full string
   2. For ANY word length: also check each individual heard token
      (handles "a duck", "the bee", "it's duck" etc.)
   3. Also check common phonetic mishearings per word
*/
const ALIASES={
  'duck':['doc','dak','dark','dug','dack'],
  'bee':['be','b','the be','sea','see','me'],
  'bear':['bare','beer'],
  'ear':['here','year','fear'],
  'eye':['i','ai','aye'],
  'cow':['caw','col'],
  'pig':['big','pick'],
  'egg':['eg','eck'],
  'one':['wan','won','un'],
  'two':['to','too','tu'],
  'four':['for','fore'],
  'six':['sex','sicks'],
  'eight':['ate','ait'],
};

function lev(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?j?0:i:j));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function sim(a,b){
  a=a.toLowerCase().trim();b=b.toLowerCase().trim();
  if(a===b)return 1;
  const L=Math.max(a.length,b.length);
  return L?1-lev(a,b)/L:1;
}

function evaluate(alts){
  if(busy)return;
  const target=deck[idx].w.toLowerCase();
  let best=0;

  alts.forEach(heard=>{
    // full phrase match
    best=Math.max(best,sim(target,heard));
    // token-by-token match (catches "a duck", "the bee")
    heard.split(/\s+/).forEach(tok=>{ best=Math.max(best,sim(target,tok)); });
  });

  // alias check — known mishearings count as correct
  const aliases=ALIASES[target]||[];
  if(best<0.75){
    alts.forEach(heard=>{
      if(aliases.includes(heard.trim())) best=1;
      heard.split(/\s+/).forEach(tok=>{ if(aliases.includes(tok)) best=1; });
    });
  }

  console.log('heard:',alts,'| target:',target,'| score:',best.toFixed(2));
  best>=0.75?onCorrect():(attempts++,onWrong(attempts));
}

/* ── MENU ── */
function buildMenu(){
  const grid=document.getElementById('menu-grid');
  grid.innerHTML='';
  Object.entries(CATS).forEach(([key,c])=>{
    const btn=document.createElement('button');
    btn.className='cat-card';btn.style.background=c.color;
    btn.innerHTML=`<div class="cc-icons">${c.preview.join('')}</div><div class="cc-title">${c.label}</div>`;
    btn.onclick=()=>startGame(key);
    grid.appendChild(btn);
  });
}

/* ── GAME ── */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}

function startGame(key){
  cat=key;deck=shuffle(CATS[key].words);idx=0;attempts=0;busy=false;
  document.getElementById('menu-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  const color=CATS[key].color;
  document.getElementById('main-card').style.borderTopColor=color;
  document.getElementById('prog-bar').style.background=color;
  document.getElementById('main-word').style.color=color;
  document.querySelectorAll('.wb').forEach(b=>b.style.background=color);
  showCard();
}

function showCard(){
  stopListening();hideFeedback();attempts=0;busy=false;
  const item=deck[idx];
  document.getElementById('main-emoji').textContent=item.e;
  document.getElementById('main-emoji').style.transform='scale(1)';
  document.getElementById('main-word').textContent=item.w.toUpperCase();
  renderSyls(item.s,-1);
  updateProg();
  setMicState('idle');
  enableMic(false);
  setStatus('LISTEN FIRST! 🔊');
  setTimeout(()=>speak(item.w,0.88,1.1,()=>{enableMic(true);setStatus('NOW SAY THE WORD! 🎤');}),500);
}

function navPrev(){
  if(busy)return;
  synth.cancel();stopListening();
  idx=(idx-1+deck.length)%deck.length;
  showCard();
}

function navNext(){
  if(busy)return;
  synth.cancel();stopListening();
  idx=(idx+1)%deck.length;
  showCard();
}

function renderSyls(syls,lit){
  const row=document.getElementById('syl-row');
  if(syls.length<=1){row.innerHTML='';return;}
  row.innerHTML=syls.map((s,i)=>`<span class="syl${i===lit?' lit':''}">${s}</span>`).join('');
}
function updateProg(){document.getElementById('prog-bar').style.width=(deck.length?(idx+1)/deck.length*100:0)+'%';}
function enableMic(on){document.getElementById('btn-mic').disabled=!on;}

/* ── CORRECT ── */
function onCorrect(){
  if(busy)return;busy=true;
  streak++;stars+=10;
  document.getElementById('stars').textContent=stars;
  setMicState('success');setStatus('GREAT JOB!');
  showFeedback('✅','AMAZING! 🎉','#51CF66');
  confetti();showStreak();
  const em=document.getElementById('main-emoji');
  em.style.transform='scale(1.4)';
  setTimeout(()=>em.style.transform='scale(1)',350);
  setTimeout(()=>{
    hideFeedback();
    idx++;
    if(idx>=deck.length)finishGame();
    else showCard();
  },1900);
}

/* ── WRONG — simple: repeat slow on 1st fail, syllables on 2nd, always re-enable mic ── */
function onWrong(n){
  streak=0;document.getElementById('streak').classList.remove('on');
  const item=deck[idx];
  enableMic(false);

  if(n===1){
    setStatus('LISTEN CAREFULLY!');
    showFeedback('👂','LISTEN AGAIN!','#FFA94D');
    setTimeout(()=>{
      hideFeedback();
      speak(item.w,0.6,1.1,()=>{enableMic(true);setStatus('TRY AGAIN! 🎤');});
    },700);
  } else {
    setStatus('LISTEN TO EACH PART!');
    showFeedback('🔤','SAY EACH PART!','#CC5DE8');
    setTimeout(()=>{
      hideFeedback();
      speakSyllables(item.s,()=>{
        speak(item.w,0.65,1.1,()=>{enableMic(true);setStatus('TRY AGAIN! 🎤');});
      });
    },700);
  }
}

/* ── FINISH ── */
function finishGame(){
  showFeedback('🏆','YOU DID IT! 🎉','#FFA94D');
  confetti();confetti();
  setTimeout(()=>{hideFeedback();goMenu();},3000);
}

/* ── UI HELPERS ── */
function setStatus(t){
  document.getElementById('status-text').textContent=t;
  document.getElementById('status-ls').textContent=t;
}
function setMicState(s){
  const b=document.getElementById('btn-mic');
  b.classList.remove('listening','success');
  if(s==='listening'){b.classList.add('listening');b.textContent='👂';}
  else if(s==='success'){b.classList.add('success');b.textContent='✅';}
  else{b.textContent='🎤';}
}
function showFeedback(emoji,text,color){
  document.getElementById('fb-emoji').textContent=emoji;
  document.getElementById('fb-text').textContent=text;
  const fb=document.getElementById('feedback');
  fb.style.background=color+'EE';fb.classList.add('show');
}
function hideFeedback(){document.getElementById('feedback').classList.remove('show');}
function showStreak(){
  if(streak<3)return;
  const el=document.getElementById('streak');
  document.getElementById('streak-n').textContent=streak;
  el.classList.add('on');clearTimeout(streakTimer);
  streakTimer=setTimeout(()=>el.classList.remove('on'),2500);
}
function confetti(){
  const cols=['#FF6B6B','#FFA94D','#CC5DE8','#339AF0','#51CF66','#F06595','#20C997','#845EF7'];
  for(let i=0;i<30;i++)setTimeout(()=>{
    const el=document.createElement('div');el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;background:${cols[0|Math.random()*cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.1+Math.random()*.9}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),2300);
  },i*42);
}
function goMenu(){
  stopListening();synth.cancel();busy=false;hideFeedback();
  document.getElementById('game-screen').style.display='none';
  document.getElementById('menu-screen').style.display='flex';
}

/* ── BUTTON EVENTS ── */
document.getElementById('btn-listen').addEventListener('click',()=>{
  if(!deck.length)return;
  enableMic(false);
  speak(deck[idx].w,0.88,1.1,()=>{enableMic(true);setStatus('NOW SAY THE WORD! 🎤');});
});
document.getElementById('btn-mic').addEventListener('click',()=>{
  if(listening){stopListening();return;}
  startListening();
});
document.getElementById('btn-back').addEventListener('click',()=>{synth.cancel();goMenu();});
document.getElementById('btn-prev').addEventListener('click',navPrev);
document.getElementById('btn-next').addEventListener('click',navNext);
document.getElementById('btn-prev-ls').addEventListener('click',navPrev);
document.getElementById('btn-next-ls').addEventListener('click',navNext);

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  if(document.getElementById('game-screen').style.display==='none')return;
  if(e.key===' '){e.preventDefault();listening?stopListening():startListening();}
  if(e.key==='ArrowRight')navNext();
  if(e.key==='ArrowLeft')navPrev();
  if(e.key==='r'||e.key==='R'){enableMic(false);speak(deck[idx].w,0.88,1.1,()=>enableMic(true));}
});
</script>
